basePath: /
definitions:
  handlers.ForgotPasswordRequest:
    properties:
      email:
        example: yuri@ps.com
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      email:
        example: yuri@ps.com
        type: string
      password:
        example: senha12345
        type: string
    type: object
  handlers.RegisterRequest:
    properties:
      email:
        example: yuri@ps.com
        type: string
      name:
        example: Yuri Nogueira
        type: string
      password:
        example: senha12345
        type: string
    type: object
  handlers.ResetPasswordRequest:
    properties:
      newPassword:
        example: novaSenha12345
        type: string
      token:
        example: a1b2c3d4e5f6...
        type: string
    type: object
  handlers.VerifyEmailRequest:
    properties:
      token:
        example: a1b2c3d4e5f6...
        type: string
    type: object
  httpx.ErrorEnvelope:
    properties:
      errors: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  httpx.SuccessEnvelope:
    properties:
      data: {}
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: suporte@ps.com
    name: Suporte PS
  description: API REST para gestão inteligente de veículos, revisões e manutenções
    do PS (Photo Storage).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: PS API
  version: "1.0"
paths:
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Envia e-mail com instruções e link para redefinir senha sem enumeração
        de usuários
      parameters:
      - description: E-mail cadastrado
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Solicitar recuperação de senha
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Autentica com e-mail e senha, seta cookies httpOnly com tokens
        e retorna dados do usuário
      parameters:
      - description: Credenciais de acesso
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Autenticação de usuário
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Remove os cookies de autenticação
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
      summary: Encerrar sessão
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      description: Retorna as informações do usuário atual com base no cookie de acesso
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Dados do usuário autenticado
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      description: Gera um novo par de tokens a partir do cookie de refresh
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Renovar token de acesso
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Cria uma nova conta de usuário, envia e-mail de confirmação, seta
        cookies httpOnly com tokens e retorna dados do usuário
      parameters:
      - description: Dados de cadastro
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Cadastro de novo usuário
      tags:
      - Auth
  /api/v1/auth/resend-verification:
    post:
      description: Reenvia o e-mail de confirmação para o usuário autenticado
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Reenviar e-mail de confirmação
      tags:
      - Auth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Redefine a senha do usuário utilizando o token recebido por e-mail
      parameters:
      - description: Token e nova senha
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Redefinir senha
      tags:
      - Auth
  /api/v1/auth/verify-email:
    post:
      consumes:
      - application/json
      description: Valida o e-mail do usuário utilizando o token de uso único recebido
      parameters:
      - description: Token de validação
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Validar endereço de e-mail
      tags:
      - Auth
  /health:
    get:
      description: Retorna o status geral de saúde da aplicação
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
      summary: Health check
      tags:
      - Health
  /live:
    get:
      description: Verifica se a aplicação está viva em execução
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
      summary: Liveness probe
      tags:
      - Health
  /ready:
    get:
      description: Verifica se a aplicação está pronta para receber tráfego
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
      summary: Readiness probe
      tags:
      - Health
securityDefinitions:
  BearerAuth:
    description: Digite "Bearer " seguido do token JWT obtido no login.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
