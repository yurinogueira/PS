basePath: /
definitions:
  client.Dog:
    properties:
      breed:
        type: string
      competitions_won:
        type: integer
      is_owner:
        type: boolean
      judge:
        type: string
      judges:
        items:
          type: string
        type: array
      photos:
        items:
          $ref: '#/definitions/client.Photo'
        type: array
      won_competitions:
        items:
          type: string
        type: array
    type: object
  client.PaginatedClients:
    properties:
      data:
        items:
          $ref: '#/definitions/client.SeasonClient'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  client.Photo:
    properties:
      amount_paid:
        type: number
      created_at:
        type: string
      file_number:
        type: string
      judges:
        items:
          type: string
        type: array
      payment_method:
        description: Pix, Cartão de Crédito, Cartão de Débito, Dinheiro, Não pago
        type: string
      photographer_id:
        type: string
    type: object
  client.SeasonClient:
    properties:
      created_at:
        type: string
      dogs:
        items:
          $ref: '#/definitions/client.Dog'
        type: array
      id:
        type: string
      person_id:
        type: string
      season_id:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
  handlers.AssignTenantRequest:
    properties:
      tenantId:
        example: acme-corp
        type: string
    type: object
  handlers.CreateTenantRequest:
    properties:
      name:
        example: acme-corp
        type: string
    type: object
  handlers.ForgotPasswordRequest:
    properties:
      email:
        example: yuri@ps.com
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      email:
        example: yuri@ps.com
        type: string
      password:
        example: senha12345
        type: string
    type: object
  handlers.RegisterRequest:
    properties:
      email:
        example: yuri@ps.com
        type: string
      name:
        example: Yuri Nogueira
        type: string
      password:
        example: senha12345
        type: string
    type: object
  handlers.ResetPasswordRequest:
    properties:
      newPassword:
        example: novaSenha12345
        type: string
      token:
        example: a1b2c3d4e5f6...
        type: string
    type: object
  handlers.VerifyEmailRequest:
    properties:
      token:
        example: a1b2c3d4e5f6...
        type: string
    type: object
  httpx.ErrorEnvelope:
    properties:
      errors: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  httpx.SuccessEnvelope:
    properties:
      data: {}
      success:
        type: boolean
    type: object
  person.Person:
    properties:
      alternative_email:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
  photographer.Photographer:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
  season.Season:
    properties:
      created_at:
        type: string
      id:
        type: string
      judges:
        items:
          type: string
        type: array
      name:
        type: string
      photographer_ids:
        items:
          type: string
        type: array
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: suporte@ps.com
    name: Suporte PS
  description: API REST para gestão inteligente de fotografias e eventos caninos do
    PS (Photo Storage).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: PS API
  version: "1.0"
paths:
  /api/v1/admin/tenants:
    get:
      description: Retorna a lista de todas as organizações (tenants) cadastradas
        no sistema
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Listar todos os tenants
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Cria uma nova organização (tenant) imutável no sistema
      parameters:
      - description: Dados do tenant
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateTenantRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Criar novo tenant
      tags:
      - Admin
  /api/v1/admin/users:
    get:
      description: Retorna a lista de todos os usuários cadastrados e seus respectivos
        tenants e status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Listar usuários para administração
      tags:
      - Admin
  /api/v1/admin/users/{id}/tenant:
    put:
      consumes:
      - application/json
      description: Vincula ou desvincula um usuário de uma organização (tenant)
      parameters:
      - description: ID do Usuário
        in: path
        name: id
        required: true
        type: string
      - description: Dados de atribuição de tenant
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.AssignTenantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Atribuir tenant a um usuário
      tags:
      - Admin
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Envia e-mail com instruções e link para redefinir senha sem enumeração
        de usuários
      parameters:
      - description: E-mail cadastrado
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Solicitar recuperação de senha
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Autentica com e-mail e senha, seta cookies httpOnly com tokens
        e retorna dados do usuário
      parameters:
      - description: Credenciais de acesso
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Autenticação de usuário
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Remove os cookies de autenticação
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
      summary: Encerrar sessão
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      description: Retorna as informações do usuário atual com base no cookie de acesso
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Dados do usuário autenticado
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      description: Gera um novo par de tokens a partir do cookie de refresh
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Renovar token de acesso
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Cria uma nova conta de usuário, envia e-mail de confirmação, seta
        cookies httpOnly com tokens e retorna dados do usuário
      parameters:
      - description: Dados de cadastro
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Cadastro de novo usuário
      tags:
      - Auth
  /api/v1/auth/resend-verification:
    post:
      description: Reenvia o e-mail de confirmação para o usuário autenticado
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Reenviar e-mail de confirmação
      tags:
      - Auth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Redefine a senha do usuário utilizando o token recebido por e-mail
      parameters:
      - description: Token e nova senha
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Redefinir senha
      tags:
      - Auth
  /api/v1/auth/verify-email:
    post:
      consumes:
      - application/json
      description: Valida o e-mail do usuário utilizando o token de uso único recebido
      parameters:
      - description: Token de validação
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Validar endereço de e-mail
      tags:
      - Auth
  /api/v1/clients:
    get:
      description: Retorna a lista paginada de clientes da temporada do tenant autenticado
        com suporte a busca e filtros
      parameters:
      - description: ID da Temporada
        in: query
        name: season_id
        type: string
      - description: Termo de busca textual (pessoa, cão ou foto)
        in: query
        name: search
        type: string
      - description: Número da página (padrão 1)
        in: query
        name: page
        type: integer
      - description: Itens por página (padrão 10, máximo 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/client.PaginatedClients'
        "401":
          description: Não autenticado
          schema:
            type: string
        "500":
          description: Erro interno
          schema:
            type: string
      summary: Listar clientes da temporada
      tags:
      - Clients
    post:
      consumes:
      - application/json
      description: Cadastra um cliente vinculado a uma temporada com cães e fotos
        para o tenant autenticado
      parameters:
      - description: Dados do Cliente da Temporada
        in: body
        name: client
        required: true
        schema:
          $ref: '#/definitions/client.SeasonClient'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/client.SeasonClient'
        "400":
          description: Requisição inválida ou referência não pertencente ao tenant
          schema:
            type: string
        "401":
          description: Não autenticado
          schema:
            type: string
        "500":
          description: Erro interno
          schema:
            type: string
      summary: Criar cliente da temporada
      tags:
      - Clients
  /api/v1/clients/{id}:
    delete:
      description: Remove um cliente da temporada do tenant autenticado
      parameters:
      - description: ID do Cliente
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Excluído com sucesso
          schema:
            type: string
        "400":
          description: ID obrigatório
          schema:
            type: string
        "401":
          description: Não autenticado
          schema:
            type: string
        "500":
          description: Erro interno
          schema:
            type: string
      summary: Excluir cliente da temporada
      tags:
      - Clients
    get:
      description: Retorna os detalhes de um cliente da temporada pelo ID
      parameters:
      - description: ID do Cliente
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/client.SeasonClient'
        "400":
          description: ID obrigatório
          schema:
            type: string
        "401":
          description: Não autenticado
          schema:
            type: string
        "404":
          description: Cliente não encontrado
          schema:
            type: string
        "500":
          description: Erro interno
          schema:
            type: string
      summary: Obter cliente por ID
      tags:
      - Clients
    put:
      consumes:
      - application/json
      description: Atualiza os dados de um cliente da temporada, cães e fotos
      parameters:
      - description: ID do Cliente
        in: path
        name: id
        required: true
        type: string
      - description: Dados do Cliente
        in: body
        name: client
        required: true
        schema:
          $ref: '#/definitions/client.SeasonClient'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/client.SeasonClient'
        "400":
          description: Requisição inválida ou referência não pertencente ao tenant
          schema:
            type: string
        "401":
          description: Não autenticado
          schema:
            type: string
        "404":
          description: Cliente não encontrado
          schema:
            type: string
        "500":
          description: Erro interno
          schema:
            type: string
      summary: Atualizar cliente da temporada
      tags:
      - Clients
  /api/v1/people:
    get:
      description: Retorna a lista de pessoas do tenant autenticado
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/person.Person'
            type: array
        "401":
          description: Não autenticado
          schema:
            type: string
        "500":
          description: Erro interno
          schema:
            type: string
      summary: Listar pessoas
      tags:
      - People
    post:
      consumes:
      - application/json
      description: Cadastra uma nova pessoa (cadastro único) para o tenant autenticado
      parameters:
      - description: Dados da Pessoa
        in: body
        name: person
        required: true
        schema:
          $ref: '#/definitions/person.Person'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/person.Person'
        "400":
          description: Requisição inválida
          schema:
            type: string
        "401":
          description: Não autenticado
          schema:
            type: string
        "500":
          description: Erro interno
          schema:
            type: string
      summary: Criar pessoa
      tags:
      - People
  /api/v1/people/{id}:
    delete:
      description: Remove uma pessoa do tenant autenticado
      parameters:
      - description: ID da Pessoa
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Excluído com sucesso
          schema:
            type: string
        "400":
          description: ID obrigatório
          schema:
            type: string
        "401":
          description: Não autenticado
          schema:
            type: string
        "500":
          description: Erro interno
          schema:
            type: string
      summary: Excluir pessoa
      tags:
      - People
    get:
      description: Retorna os detalhes de uma pessoa específica pelo ID
      parameters:
      - description: ID da Pessoa
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/person.Person'
        "400":
          description: ID obrigatório
          schema:
            type: string
        "401":
          description: Não autenticado
          schema:
            type: string
        "404":
          description: Pessoa não encontrada
          schema:
            type: string
        "500":
          description: Erro interno
          schema:
            type: string
      summary: Obter pessoa por ID
      tags:
      - People
    put:
      consumes:
      - application/json
      description: Atualiza os dados de uma pessoa existente
      parameters:
      - description: ID da Pessoa
        in: path
        name: id
        required: true
        type: string
      - description: Dados da Pessoa
        in: body
        name: person
        required: true
        schema:
          $ref: '#/definitions/person.Person'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/person.Person'
        "400":
          description: Requisição inválida
          schema:
            type: string
        "401":
          description: Não autenticado
          schema:
            type: string
        "500":
          description: Erro interno
          schema:
            type: string
      summary: Atualizar pessoa
      tags:
      - People
  /api/v1/photographers:
    get:
      description: Retorna a lista de fotógrafos do tenant autenticado
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/photographer.Photographer'
            type: array
        "401":
          description: Não autenticado
          schema:
            type: string
        "500":
          description: Erro interno
          schema:
            type: string
      summary: Listar fotógrafos
      tags:
      - Photographers
    post:
      consumes:
      - application/json
      description: Cadastra um novo fotógrafo para o tenant autenticado
      parameters:
      - description: Dados do Fotógrafo
        in: body
        name: photographer
        required: true
        schema:
          $ref: '#/definitions/photographer.Photographer'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/photographer.Photographer'
        "400":
          description: Requisição inválida
          schema:
            type: string
        "401":
          description: Não autenticado
          schema:
            type: string
        "500":
          description: Erro interno
          schema:
            type: string
      summary: Criar fotógrafo
      tags:
      - Photographers
  /api/v1/photographers/{id}:
    delete:
      description: Remove um fotógrafo do tenant autenticado
      parameters:
      - description: ID do Fotógrafo
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Excluído com sucesso
          schema:
            type: string
        "400":
          description: ID obrigatório
          schema:
            type: string
        "401":
          description: Não autenticado
          schema:
            type: string
        "500":
          description: Erro interno
          schema:
            type: string
      summary: Excluir fotógrafo
      tags:
      - Photographers
    get:
      description: Retorna os detalhes de um fotógrafo específico pelo ID
      parameters:
      - description: ID do Fotógrafo
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/photographer.Photographer'
        "400":
          description: ID obrigatório
          schema:
            type: string
        "401":
          description: Não autenticado
          schema:
            type: string
        "404":
          description: Fotógrafo não encontrado
          schema:
            type: string
        "500":
          description: Erro interno
          schema:
            type: string
      summary: Obter fotógrafo por ID
      tags:
      - Photographers
    put:
      consumes:
      - application/json
      description: Atualiza os dados de um fotógrafo existente
      parameters:
      - description: ID do Fotógrafo
        in: path
        name: id
        required: true
        type: string
      - description: Dados do Fotógrafo
        in: body
        name: photographer
        required: true
        schema:
