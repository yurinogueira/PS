      description: Retorna os detalhes de uma temporada específica pelo ID
      parameters:
      - description: ID da Temporada
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/season.Season'
